apiVersion: apps/v1
kind: Deployment
metadata:
  name: clean-workload
spec:
  template:
    spec:
      hostNetwork: false
      securityContext:
        runAsUser: 10001
      containers:
        - name: app
          image: app:v1.0.0
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsUser: 10001
          env:
            - name: PORT
              value: "8080"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
